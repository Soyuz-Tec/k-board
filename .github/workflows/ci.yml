name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Exercise the documented monthly recovery drill even when no code changes.
    - cron: "17 3 1 * *"

env:
  CARGO_TERM_COLOR: always
  # A failed build should not also cost a long incremental-compile cache write.
  CARGO_INCREMENTAL: 0

jobs:
  verify:
    name: test / lint / format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Required only for the report-only PR size comparison below.
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Architecture boundaries and documentation
        run: node scripts/architecture-check.mjs

      - name: Durable client outbox
        run: node scripts/client-outbox-check.mjs

      - name: Standalone and Embedded SDK contract
        run: node scripts/embed-sdk-check.mjs

      - name: Review-size advisory
        run: node scripts/review-size-report.mjs

      - name: Format
        run: cargo fmt --all -- --check

      # Warnings are failures here. This crate is linked into other people's
      # processes; a lint we tolerate becomes a defect someone else operates.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Upgraded database release smoke
        run: cargo test --release -p kboard-store tests::every_supported_schema_fixture_migrates_to_current -- --exact

      - name: Doc tests
        run: cargo test --workspace --doc

      # Compiled, not run. Benchmark timings on a shared runner are noise, but a
      # bench that stops compiling is a real break and would otherwise only
      # surface the next time somebody measured.
      - name: Benchmarks compile
        run: cargo build --workspace --benches

  wasm:
    name: wasm32 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # The whole architecture rests on the engine compiling to both native and
      # wasm. If this job breaks, the "same merge code on client and server"
      # guarantee is gone and the bug it prevents is back.
      #
      # Only the engine crates are built here. kboard-server is native by
      # design — it is the standalone adapter, and its tokio/mio networking
      # stack has no wasm32-unknown-unknown target. Building --workspace would
      # fail for a reason that says nothing about the engine's portability.
      - name: Build engine for wasm32
        run: cargo build -p kboard-core -p kboard-ffi --target wasm32-unknown-unknown --release

  convergence:
    name: convergence proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Called out as its own job so a regression here is unmistakable in the
      # checks list. These are the tests that decide whether replicas can
      # permanently disagree.
      - name: Exhaustive convergence suite
        run: cargo test -p kboard-core --test convergence -- --nocapture

  msrv:
    name: minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The manifest declares rust-version = 1.85. An undeclared bump is a
      # breaking change for hosts pinned to an older toolchain, so it is
      # verified rather than asserted.
      - uses: dtolnay/rust-toolchain@1.85.0

      - uses: Swatinem/rust-cache@v2

      - name: Build at MSRV
        run: cargo build --workspace --all-targets

  e2e:
    name: end-to-end convergence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # Node 22+ for the built-in WebSocket client, so the check needs no
      # npm install and no dependency of its own.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build engine and server
        run: |
          cargo build -p kboard-ffi --release
          cargo build -p kboard-ffi --target wasm32-unknown-unknown --release
          cargo build -p kboard-server --release

      - name: Start server
        run: |
          ./target/release/kboard-server &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/health && break
            sleep 1
          done

      # Proves the whole path — wasm engine, wire format, server fan-out —
      # not just the merge laws in isolation.
      - name: Two-replica convergence
        run: node scripts/two-replica-check.mjs

      - name: Protocol v2 and mixed-version delivery
        run: node scripts/protocol-v2-check.mjs

      # Kills the server and starts a new process against the same database.
      # Nothing short of an actual restart demonstrates that a board survives
      # the process that was holding it.
      - name: Restart durability
        run: node scripts/restart-durability-check.mjs

      - name: Storage migration and checkpoint health
        run: node scripts/storage-health-check.mjs

      - name: Room-cell fairness SLO
        run: node scripts/room-cell-slo-check.mjs

      - name: Backup and isolated restore game day
        run: node scripts/backup-restore-drill.mjs

      # The unit tests prove the token maths. This proves the running server
      # turns an unauthenticated handshake away, and will not start at all in
      # the one configuration where being open is dangerous.
      - name: Authentication
        run: node scripts/auth-check.mjs

      # The interesting assertions are negative: cursors must reach peers
      # *without* being accepted into the document or written to the log.
      - name: Presence
        run: node scripts/presence-check.mjs

      # A client that resends its whole idea of an element's look silently
      # reverts a colleague's concurrent restyle. The assertion is negative.
      - name: Style
        run: node scripts/style-check.mjs

      # Scaling a stroke without its path, or stretching a label on one axis,
      # both look fine on a rectangle and fall apart on everything else.
      - name: Transform
        run: node scripts/transform-check.mjs

      # A copy that kept its element id would rewrite the original instead of
      # adding a shape — a "paste" that silently moves what you copied.
      - name: Clipboard
        run: node scripts/clipboard-check.mjs

      # Drives the canvas and SVG back-ends from one scene and compares what
      # each drew. An export that does not match the screen is only discovered
      # after the file has been sent.
      - name: Export fidelity
        run: node scripts/export-check.mjs

      - name: Assemble immutable release candidate
        shell: bash
        run: |
          bundle="dist/k-board-${GITHUB_SHA}"
          mkdir -p "$bundle/web"
          cp target/release/kboard-server "$bundle/"
          cp target/release/libkboard.so target/release/libkboard.a "$bundle/"
          cp target/wasm32-unknown-unknown/release/kboard.wasm "$bundle/"
          cp web/*.js web/*.mjs web/*.html web/*.css "$bundle/web/"
          cp README.md LICENSE "$bundle/"
          (cd "$bundle" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Validate assembled release candidate
        shell: bash
        run: |
          bundle="dist/k-board-${GITHUB_SHA}"
          (cd "$bundle" && sha256sum -c SHA256SUMS)
          PORT=8180 \
          KBOARD_DB="$RUNNER_TEMP/k-board-artifact.sqlite3" \
          KBOARD_WEB="$bundle/web" \
          KBOARD_WASM="$bundle/kboard.wasm" \
          "$bundle/kboard-server" >"$RUNNER_TEMP/k-board-artifact.log" 2>&1 &
          artifact_pid=$!
          trap 'kill "$artifact_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8180/health/ready && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8180/health/ready | grep -q '"status":"ready"'
          curl -sf http://127.0.0.1:8180/kboard.wasm >/dev/null
          curl -sf http://127.0.0.1:8180/embed >/dev/null
          curl -sf http://127.0.0.1:8180/embed-sdk.js >/dev/null
          curl -sf http://127.0.0.1:8180/embed-demo.html >/dev/null
          test "$(curl -sI http://127.0.0.1:8180/embed-sdk.js | tr -d '\r' | awk -F': ' 'tolower($1)=="access-control-allow-origin" {print $2}')" = "*"

      - name: Upload immutable release candidate
        uses: actions/upload-artifact@v4
        with:
          name: k-board-${{ github.sha }}
          path: dist/k-board-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit
        run: cargo audit

      # cargo-audit covers published advisories only. This covers licences,
      # duplicate versions, and dependency sources — which matter more here,
      # because anyone embedding the engine inherits its whole licence tree.
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Dependency policy
        run: cargo deny check
