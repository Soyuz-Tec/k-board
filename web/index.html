<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>k-board</title>
    <link rel="stylesheet" href="./style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>%E2%9C%8F%EF%B8%8F</text></svg>"
    />
  </head>
  <body>
    <header class="bar">
      <div class="brand">k&#8209;board</div>

      <div class="tools" role="toolbar" aria-label="Drawing tools">
        <button data-tool="select" class="tool" aria-pressed="true" title="Select and move (V)">
          <span aria-hidden="true">&#9737;</span><span class="label">Select</span>
        </button>
        <button data-tool="rectangle" class="tool" aria-pressed="false" title="Rectangle (R)">
          <span aria-hidden="true">&#9645;</span><span class="label">Rect</span>
        </button>
        <button data-tool="ellipse" class="tool" aria-pressed="false" title="Ellipse (O)">
          <span aria-hidden="true">&#9711;</span><span class="label">Ellipse</span>
        </button>
        <button data-tool="diamond" class="tool" aria-pressed="false" title="Diamond (D)">
          <span aria-hidden="true">&#9671;</span><span class="label">Diamond</span>
        </button>
        <button data-tool="arrow" class="tool" aria-pressed="false" title="Arrow (A)">
          <span aria-hidden="true">&#8599;</span><span class="label">Arrow</span>
        </button>
        <button data-tool="freedraw" class="tool" aria-pressed="false" title="Pen (P)">
          <span aria-hidden="true">&#9998;</span><span class="label">Pen</span>
        </button>
        <button data-tool="text" class="tool" aria-pressed="false" title="Text (T)">
          <span aria-hidden="true">&#84;</span><span class="label">Text</span>
        </button>
        <button data-tool="eraser" class="tool" aria-pressed="false" title="Eraser (E)">
          <span aria-hidden="true">&#9003;</span><span class="label">Erase</span>
        </button>
      </div>

      <!--
        Every control here does two things: it restyles whatever is selected,
        and it becomes the style of the next thing drawn. Splitting those into
        separate controls is the arrangement where people restyle a shape and
        then wonder why the next one came out with the old colour.
      -->
      <div class="swatches" role="radiogroup" aria-label="Stroke colour">
        <button class="swatch" data-colour="#1e1e1e" style="--c: #1e1e1e" role="radio" aria-checked="true" aria-label="Ink stroke"></button>
        <button class="swatch" data-colour="#e03131" style="--c: #e03131" role="radio" aria-checked="false" aria-label="Red stroke"></button>
        <button class="swatch" data-colour="#1971c2" style="--c: #1971c2" role="radio" aria-checked="false" aria-label="Blue stroke"></button>
        <button class="swatch" data-colour="#2f9e44" style="--c: #2f9e44" role="radio" aria-checked="false" aria-label="Green stroke"></button>
        <button class="swatch" data-colour="#f08c00" style="--c: #f08c00" role="radio" aria-checked="false" aria-label="Amber stroke"></button>
      </div>

      <div class="swatches" role="radiogroup" aria-label="Fill colour">
        <button class="swatch none" data-fill="none" role="radio" aria-checked="true" aria-label="No fill"></button>
        <button class="swatch" data-fill="#ffc9c9" style="--c: #ffc9c9" role="radio" aria-checked="false" aria-label="Red fill"></button>
        <button class="swatch" data-fill="#a5d8ff" style="--c: #a5d8ff" role="radio" aria-checked="false" aria-label="Blue fill"></button>
        <button class="swatch" data-fill="#b2f2bb" style="--c: #b2f2bb" role="radio" aria-checked="false" aria-label="Green fill"></button>
        <button class="swatch" data-fill="#ffec99" style="--c: #ffec99" role="radio" aria-checked="false" aria-label="Amber fill"></button>
      </div>

      <div class="widths" role="radiogroup" aria-label="Stroke width">
        <button class="width" data-width="1" role="radio" aria-checked="false" aria-label="Thin stroke"><span aria-hidden="true"></span></button>
        <button class="width" data-width="2" role="radio" aria-checked="true" aria-label="Medium stroke"><span aria-hidden="true"></span></button>
        <button class="width" data-width="5" role="radio" aria-checked="false" aria-label="Thick stroke"><span aria-hidden="true"></span></button>
      </div>

      <label class="opacity">
        <span class="label">Opacity</span>
        <input id="opacity" type="range" min="10" max="100" step="10" value="100" aria-label="Opacity, percent" />
      </label>

      <div class="history">
        <button id="undo" class="ghost" disabled title="Undo (Ctrl+Z)">Undo</button>
        <button id="redo" class="ghost" disabled title="Redo (Ctrl+Shift+Z)">Redo</button>
      </div>

      <!--
        Export is client-side: the board never leaves the tab to become a file.
        Nothing to upload, nothing to wait for, and it works on a local board
        with no server at all.
      -->
      <div class="export" role="group" aria-label="Export">
        <button id="exportPng" class="ghost" disabled title="Download the board as a PNG">PNG</button>
        <button id="exportSvg" class="ghost" disabled title="Download the board as an SVG">SVG</button>
      </div>

      <div class="spacer"></div>

      <button id="clear" class="ghost" title="Clear the board for everyone">Clear</button>
      <div class="status" id="status" role="status" aria-live="polite">
        <span class="dot" id="dot"></span><span id="statusText">starting</span>
      </div>
    </header>

    <main>
      <canvas
        id="canvas"
        tabindex="0"
        role="application"
        aria-label="Drawing canvas. Tab cycles the selection, Escape clears it."
      ></canvas>

      <!--
        The accessibility tree. Canvas content is invisible to assistive
        technology because it is not in the DOM; this mirrors the scene as real
        elements so it can be read and navigated. It is not decoration.
      -->
      <section id="a11y" class="sr-only" aria-live="polite">
        <h2>Canvas contents</h2>
        <ul id="a11yList"></ul>

        <!--
          Peer cursors are pixels, so they say nothing to a screen reader. Who
          is present is information, not decoration, and it belongs here.
        -->
        <p id="peerList">You are the only one here.</p>
        <p id="selectionText">Nothing selected.</p>
      </section>

      <!--
        A real textarea rather than a caret drawn on the canvas: it brings
        selection, an IME, spellcheck and screen-reader support with it, all of
        which would be worse if reimplemented and wrong in most cases.
      -->
      <textarea
        id="editor"
        hidden
        rows="1"
        spellcheck="false"
        aria-label="Text content"
      ></textarea>

      <div id="hint" class="hint">
        <strong>Open this page in a second tab</strong> — both are separate
        replicas. Draw in either and watch them converge.
      </div>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
