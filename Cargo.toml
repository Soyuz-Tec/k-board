[workspace]
resolver = "2"
members = ["crates/kboard-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Soyuz-Tec/k-board"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Deliberately NOT `panic = "abort"`. Hosts embed this as a native library and
# must be able to trap a panic at the FFI boundary — aborting would take down
# the host process (a BEAM node, a JVM) instead of failing one call.
panic = "unwind"

# The wasm and cdylib artifacts are size-sensitive; hosts embed them.
[profile.release-compact]
inherits = "release"
opt-level = "z"
strip = true
