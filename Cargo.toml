[workspace]
resolver = "2"
members = ["crates/kboard-core", "crates/kboard-ffi", "crates/kboard-server", "crates/kboard-store"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Soyuz-Tec/k-board"

[workspace.dependencies]
# Carries a version as well as a path. A path-only dependency resolves as a
# wildcard, which crates.io refuses to publish — so the engine could not be
# released as the embeddable artifact it exists to be.
kboard-core = { path = "crates/kboard-core", version = "0.1.0" }
kboard-store = { path = "crates/kboard-store", version = "0.1.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `default-features = false` drops the plotting stack, which pulls a large
# transitive tree for HTML reports nobody reads in CI.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Deliberately NOT `panic = "abort"`. Hosts embed this as a native library and
# must be able to trap a panic at the FFI boundary — aborting would take down
# the host process (a BEAM node, a JVM) instead of failing one call.
panic = "unwind"

# The wasm and cdylib artifacts are size-sensitive; hosts embed them.
[profile.release-compact]
inherits = "release"
opt-level = "z"
strip = true
