[package]
name = "kboard-store"
description = "SQLite-backed durable storage adapter for the k-board engine's OpLog and SnapshotStore ports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
bench = false

[dependencies]
kboard-core = { workspace = true }
serde_json = { workspace = true }
# `bundled` compiles SQLite from source rather than linking whatever the host
# happens to ship. A storage engine whose version varies by machine is not a
# durability guarantee, and the engine is meant to run in other people's
# environments.
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
criterion = { workspace = true }

# Criterion supplies its own argument parsing, so the default libtest harness
# has to be off or `cargo bench` cannot pass it filters and output flags.
[[bench]]
name = "store"
harness = false
